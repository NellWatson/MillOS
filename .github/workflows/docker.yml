name: Docker Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'scada-proxy/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scada-proxy/**'
      - '.github/workflows/docker.yml'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: ./scada-proxy
      file: Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/${{ github.repository }}/scada-proxy
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,prefix=sha-
      meta-labels: |
        org.opencontainers.image.description=AI-Powered Grain Mill Digital Twin Simulator with SCADA Integration
        org.opencontainers.image.licenses=MIT
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  scan:
    name: Scan Docker Image
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(needs.build-and-push.outputs.meta-json).tags[0] }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
